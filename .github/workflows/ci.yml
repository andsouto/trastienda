name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma.config.ts resolves it eagerly; no database is contacted by generate
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Duplicated from mise.toml on purpose: setup-node cannot read mise.toml yet
      # (v7.0.0 only parses .nvmrc/.node-version/.tool-versions/package.json). Renovate
      # moves both pins in one PR and the next step fails if they ever drift apart.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Node version matches mise.toml
        run: |
          grep -qxF "node = \"$(node -v | tail -c +2)\"" mise.toml || {
            echo "::error file=mise.toml::mise.toml and the workflow node pin have diverged"
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @trastienda/api run prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Contract codegen is up to date
        run: |
          pnpm codegen
          # --intent-to-add so a generated file that is new (a new tag becomes a
          # new directory) shows up in the diff instead of passing as untracked
          git add --intent-to-add -- apps/api/openapi.json apps/admin/src/app/core/api
          git diff --exit-code -- apps/api/openapi.json apps/admin/src/app/core/api

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
