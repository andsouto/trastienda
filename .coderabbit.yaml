# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews and comments; it never commits, approves or blocks (ADR-0009).
# This file replaces the web UI settings entirely: keys left out take CodeRabbit's
# defaults, and CLAUDE.md is read as review guidelines without being listed here.

tone_instructions: >-
  Be terse. No praise. Lead with the concrete problem and its consequence. Skip what CI
  already enforces: lint, formatting, types, contract drift.

reviews:
  # A "Request changes" review blocks the merge even with zero required approvals
  request_changes_workflow: false
  # The PR description belongs to its author: the summary goes in the bot's comment
  high_level_summary_in_walkthrough: true
  in_progress_fortune: false
  auto_review:
    # Renovate PRs automerge on green CI; the release PR is generated
    ignore_usernames:
      - 'renovate[bot]'
      - 'github-actions[bot]'
  path_instructions:
    - path: apps/admin/src/app/core/api/**
      instructions: >-
        Generated by `pnpm codegen` from apps/api/openapi.json; CI fails if it drifts. Do
        not comment on it.
    - path: apps/api/openapi.json
      instructions: >-
        Generated by `pnpm codegen` from the route schemas; CI fails if it drifts. Do not
        comment on it.
  # Every commit lands verbatim on main and has to pass commitlint, and conflicts in
  # generated files or CI failures here are fixed by regenerating: changes are made
  # where verify runs, never by the bot on the branch
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    # There is no JSDoc policy, so it would warn on every PR
    docstrings:
      mode: 'off'
    # With rebase merges the PR title never reaches main; commitlint checks what does
    title:
      mode: 'off'
  tools:
    # verify is the authoritative ESLint run; a second one can only duplicate it or run
    # without the generated Prisma client
    eslint:
      enabled: false
