name: CodeQL

# A workflow rather than GitHub's default setup, which skips pull requests from forks: the
# required `CodeQL` check would never report on a contributor's PR and it could not merge.
# No schedule: the analyzer version comes pinned with the action, so unchanged code only
# gets new results when Renovate bumps it, and merging that bump is itself a push to main
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Each job name is a required check in the ruleset, next to `CodeQL`: renaming it
    # leaves every PR waiting for a check that never reports
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Uploading the results needs it; this job never installs or runs dependency code
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}

      # Same category as default setup used, so existing alerts keep their history
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
